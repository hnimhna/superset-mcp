# Continuous deployment to DEV. Every merge to main lands here automatically.
name: deploy-dev

on:
  push:
    branches: [main]
    paths: ['assets/**', 'config/**', 'scripts/**', '.github/workflows/deploy-dev.yml']
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false      # never interrupt a deployment mid-import

jobs:
  deploy:
    name: deploy to DEV
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    env:
      SUPERSET_ENV: dev
      SUPERSET_URL: ${{ vars.SUPERSET_URL }}
      MCP_URL: ${{ vars.MCP_URL }}
      SUPERSET_API_USERNAME: ${{ secrets.SUPERSET_API_USERNAME }}
      SUPERSET_API_PASSWORD: ${{ secrets.SUPERSET_API_PASSWORD }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      WAREHOUSE_DB_PASSWORD: ${{ secrets.WAREHOUSE_DB_PASSWORD }}
      GITOPS_ACTOR: ${{ github.actor }}
      GITOPS_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: validate assets
        run: python scripts/validate.py --env dev

      - name: back up current DEV state
        # Captured before anything changes, and written outside assets/ so the
        # working tree is never polluted with untracked exported files.
        run: python scripts/export.py --env dev --output .backup/assets-pre-deploy || true

      - name: dry run
        run: python scripts/import.py --env dev --dry-run

      - name: deploy
        run: python scripts/import.py --env dev

      - name: smoke test
        run: python scripts/smoke_test.py --env dev --json | tee smoke-dev.json

      - name: verify no drift after deploy
        run: python scripts/diff.py --env dev --fail-on-drift

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-dev-${{ github.sha }}
          path: |
            smoke-dev.json
            .deployments/
          retention-days: 30
