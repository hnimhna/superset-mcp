# Promotion to PRODUCTION.
#
# Production is the only environment that:
#   * requires a manual approval gate (GitHub Environment protection rules),
#   * refuses to deploy when PROD has drifted away from Git,
#   * takes a restorable backup before changing anything,
#   * rolls itself back automatically when verification fails.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production deployment'
        required: true
        type: string
      ignore_drift:
        description: 'Deploy even if PROD has drifted (overwrites the drift)'
        required: false
        default: false
        type: boolean
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  guard:
    name: confirmation guard
    runs-on: ubuntu-latest
    steps:
      - name: require explicit confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Confirmation text must be exactly DEPLOY."
          exit 1

  deploy:
    name: deploy to PROD
    needs: [guard]
    runs-on: ubuntu-latest
    # Configure this GitHub Environment with required reviewers: that approval
    # is the human gate in the DEV -> STAGING -> PROD promotion path.
    environment:
      name: prod
      url: ${{ vars.SUPERSET_URL }}
    timeout-minutes: 45
    env:
      SUPERSET_ENV: prod
      SUPERSET_URL: ${{ vars.SUPERSET_URL }}
      MCP_URL: ${{ vars.MCP_URL }}
      SUPERSET_API_USERNAME: ${{ secrets.SUPERSET_API_USERNAME }}
      SUPERSET_API_PASSWORD: ${{ secrets.SUPERSET_API_PASSWORD }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      WAREHOUSE_DB_PASSWORD: ${{ secrets.WAREHOUSE_DB_PASSWORD }}
      GITOPS_ACTOR: ${{ github.actor }}
      GITOPS_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # rollback needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # ---- pre-flight -------------------------------------------------
      - name: validate assets
        run: python scripts/validate.py --env prod

      - name: 1. back up current PROD state
        # Written to .backup/, never into assets/. Exporting into assets/ and
        # then running `git checkout -- assets` would leave UNTRACKED files
        # behind (an asset that exists only in PROD), and the drift gate below
        # would then compare that leftover against PROD, see them identical,
        # and pass - defeating the very check it is there to perform.
        run: |
          python scripts/export.py --env prod --output .backup/assets-pre-deploy
          tar -czf prod-backup-${{ github.sha }}.tar.gz -C .backup assets-pre-deploy
          git status --porcelain assets/    # must be empty

      - name: 2. refuse to deploy over unreviewed drift
        if: ${{ !inputs.ignore_drift }}
        run: |
          python scripts/diff.py --env prod --fail-on-drift || {
            echo "::error::PROD has drifted from Git. Someone changed production"
            echo "outside the GitOps workflow. Reconcile deliberately:"
            echo "  scripts/export.sh --env prod   # accept the change into Git"
            echo "  scripts/import.sh --env prod   # discard it and restore Git"
            echo "Or re-run with ignore_drift=true to overwrite it knowingly."
            exit 1
          }

      - name: 3. record the deployment commit
        run: |
          echo "Deploying ${{ github.sha }} to PROD" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %an %s' >> "$GITHUB_STEP_SUMMARY"

      - name: dry run
        run: python scripts/import.py --env prod --dry-run

      # ---- deploy -----------------------------------------------------
      - name: 4. import Git assets
        run: python scripts/import.py --env prod

      # ---- verify -----------------------------------------------------
      - name: 5. smoke test
        id: smoke
        run: python scripts/smoke_test.py --env prod --json | tee smoke-prod.json

      - name: 6. dashboard health via E2E
        run: npx playwright test tests/e2e/specs/dashboard-render.spec.ts

      - name: 7. confirm PROD now matches Git
        run: python scripts/diff.py --env prod --fail-on-drift

      # ---- fail safely ------------------------------------------------
      - name: roll back on any verification failure
        if: failure()
        # Restores from the pre-deploy backup, NOT from .deployments/ history:
        # that file is gitignored, so a fresh CI checkout has no history and a
        # history-based rollback would fail exactly when it is needed.
        run: |
          echo "::error::Production verification failed. Rolling back."
          python scripts/rollback.py --env prod --from-dir .backup/assets-pre-deploy
          python scripts/smoke_test.py --env prod
          echo "Rolled back to the pre-deploy state." >> "$GITHUB_STEP_SUMMARY"

      - name: 8. record deployment metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-prod-${{ github.sha }}
          path: |
            smoke-prod.json
            prod-backup-${{ github.sha }}.tar.gz
            .deployments/
            playwright-report/
          retention-days: 90

  drift-watch:
    name: post-deploy drift check
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      SUPERSET_ENV: prod
      SUPERSET_URL: ${{ vars.SUPERSET_URL }}
      MCP_URL: ${{ vars.MCP_URL }}
      SUPERSET_API_USERNAME: ${{ secrets.SUPERSET_API_USERNAME }}
      SUPERSET_API_PASSWORD: ${{ secrets.SUPERSET_API_PASSWORD }}
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/diff.py --env prod --quiet
