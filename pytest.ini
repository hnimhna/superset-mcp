[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    unit: pure-logic tests, no Superset instance required
    integration: requires a running Superset (SUPERSET_URL)
    api: exercises the Superset REST API directly
    e2e: browser tests, run via Playwright rather than pytest
filterwarnings =
    ignore::DeprecationWarning
